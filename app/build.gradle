apply plugin: 'com.android.application'

android {
    compileSdk 37

    defaultConfig {
        applicationId "com.lostandfondue.ronda"
        minSdkVersion 23
        targetSdk 37
        versionCode 6
        versionName "2.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.lostandfondue.ronda'

    buildFeatures {
        viewBinding = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

}

// Los tests de src/test corren con Robolectric contra la imagen de API 37, la
// misma que targetSdk (ver app/src/test/resources/robolectric.properties), y esa
// imagen exige Java 21. La app se compila con Java 17 (compileOptions, arriba) y
// Gradle arranca con el JDK 17 de Android Studio, así que aquí se pide un JDK 21
// sólo para el proceso que ejecuta los tests; Gradle lo descarga la primera vez.
tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // Robolectric trastea con las tripas de la JDK: para emular los
    // FileDescriptor de libcore llama por reflexión a
    // jdk.internal.access.SharedSecrets, un paquete que java.base no exporta.
    // En API 37 hace falta sí o sí, porque ApplicationSharedMemory lo usa al
    // levantar la app; sin esto cada test muere en el arranque con
    // "Failed to interact with raw FileDescriptor internals".
    jvmArgs += [
        '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED',
        '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
    ]
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
