# SDK con el que Robolectric ejecuta TODOS los tests de src/test.
#
# Antes cada clase lo fijaba por su cuenta con @Config(sdk = [34]), cuatro
# copias que se quedaron atrás del targetSdk de la app. Importa: a partir de
# API 35 el edge-to-edge es obligatorio y windowSoftInputMode="adjustResize"
# deja de redimensionar la ventana, así que en 34 los tests validaban una
# configuración en la que la app ya no corre (y no podían ver que los botones
# de "Cambiar nombres" quedaban tapados por el teclado).
#
# 37 es el targetSdk de la app: los tests corren en la misma API que los
# usuarios. Necesita Robolectric 4.17 o posterior (la 4.16 no traía imagen de
# API 37) y Java 21, que se pide en app/build.gradle sólo para las tareas de
# test. Al subir el targetSdk, subir esto con él.
sdk=37
